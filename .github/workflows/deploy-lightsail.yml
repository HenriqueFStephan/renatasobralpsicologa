name: Deploy site to Lightsail

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "scripts/deploy_lightsail_remote.sh"
      - ".github/workflows/deploy-lightsail.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build the site
        working-directory: frontend
        env:
          NG_APP_API_URL: /api/v1
        run: npm ci && npm run build:ci

      - name: Prepare SSH
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$LIGHTSAIL_SSH_KEY" > ~/.ssh/lightsail.pem
          chmod 600 ~/.ssh/lightsail.pem
          ssh-keyscan -H "$LIGHTSAIL_HOST" >> ~/.ssh/known_hosts

      - name: Bootstrap once, beside the existing site
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          if ssh -i ~/.ssh/lightsail.pem -o IdentitiesOnly=yes "ubuntu@${LIGHTSAIL_HOST}" "test -f /etc/systemd/system/renata-api.service"; then
            echo "renata-api is already installed."
          else
            scp -i ~/.ssh/lightsail.pem -o IdentitiesOnly=yes \
              scripts/bootstrap_lightsail.sh "ubuntu@${LIGHTSAIL_HOST}:/tmp/bootstrap_lightsail.sh"
            ssh -i ~/.ssh/lightsail.pem -o IdentitiesOnly=yes \
              "ubuntu@${LIGHTSAIL_HOST}" sudo bash /tmp/bootstrap_lightsail.sh
          fi

      - name: Pack and send
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          tar -czf /tmp/site.tgz -C frontend/dist/renata .
          tar -czf /tmp/api.tgz backend
          scp -i ~/.ssh/lightsail.pem -o IdentitiesOnly=yes \
            /tmp/site.tgz /tmp/api.tgz scripts/deploy_lightsail_remote.sh \
            "ubuntu@${LIGHTSAIL_HOST}:/tmp/"
          ssh -i ~/.ssh/lightsail.pem -o IdentitiesOnly=yes \
            "ubuntu@${LIGHTSAIL_HOST}" sudo bash /tmp/deploy_lightsail_remote.sh

      - name: Issue the certificate when it is missing
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          ssh -i ~/.ssh/lightsail.pem -o IdentitiesOnly=yes "ubuntu@${LIGHTSAIL_HOST}" "sudo bash -s" <<'EOF'
          if [ -d /etc/letsencrypt/live/renatasobralpsicologa.com.br ]; then
            echo "Certificate already present."
            exit 0
          fi
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y certbot python3-certbot-nginx
          certbot --nginx --non-interactive --agree-tos \
            --email contato@renatasobralpsicologa.com.br \
            -d renatasobralpsicologa.com.br -d www.renatasobralpsicologa.com.br
          EOF

      - name: Set maintenance key when the secret exists
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          BLOCKWALL_KEY: ${{ secrets.BLOCKWALL_KEY }}
        run: |
          if [ -z "${BLOCKWALL_KEY}" ]; then
            echo "BLOCKWALL_KEY is unset. debt.txt is unchanged."
            exit 0
          fi
          scp -i ~/.ssh/lightsail.pem -o IdentitiesOnly=yes \
            scripts/set_blockwall_key.sh "ubuntu@${LIGHTSAIL_HOST}:/tmp/set_blockwall_key.sh"
          printf '%s' "$BLOCKWALL_KEY" | ssh -i ~/.ssh/lightsail.pem -o IdentitiesOnly=yes \
            "ubuntu@${LIGHTSAIL_HOST}" "sudo tee /tmp/blockwall.key >/dev/null && sudo bash /tmp/set_blockwall_key.sh"
